name: qaati
description: Qaati - Khat Marketplace App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  provider: ^6.0.5
  shared_preferences: ^2.2.2
  # Auth token/user data live here (Keychain on iOS, EncryptedSharedPreferences
  # on Android) rather than plain shared_preferences, which is unencrypted
  # plaintext on both platforms.
  flutter_secure_storage: ^9.0.0
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  socket_io_client: ^2.0.2
  image_picker: ^1.0.7
  camera: ^0.10.5+9
  cached_network_image: ^3.3.1
  flutter_rating_bar: ^4.0.1
  intl: ^0.18.1
  shimmer: ^3.0.0
  flutter_local_notifications: ^16.3.0
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  firebase_analytics: ^10.8.0
  url_launcher: ^6.2.2
  flutter_staggered_grid_view: ^0.7.0
  carousel_slider: ^4.2.1
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
